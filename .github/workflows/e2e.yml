name: E2E Tests

# TRIGGERS DISABLED 2026-08-27 - manual dispatch only.
#
# The four specs under frontend/tests/e2e are real and worth keeping, but this
# workflow has been red on every push for months and never reached them. It
# dies at `pnpm install`: it pins pnpm 8 via action-setup@v2, while the repo is
# on pnpm@10.30.3, whose lockfile pnpm 8 cannot read (ERR_PNPM_NO_LOCKFILE).
# Rather than leave a permanently failing check on every commit, it is parked
# here until someone owns the repair.
#
# Restoring it needs all four of these - bumping pnpm alone only moves the
# failure further down:
#   1. pnpm/action-setup@v4 with version 10.30.3 and node 22, matching
#      typecheck.yml.
#   2. Swap the mysql:8.0 service for postgres. backend/prisma/schema.prisma is
#      provider = "postgresql"; the trio left MySQL in July 2026, so the
#      mysql:// DATABASE_URL below cannot migrate.
#   3. Provide test data. `pnpm run db:seed` runs prisma/seed.ts, but the dev
#      seed rows were removed by hand (see d37de54) and no working seed path is
#      guaranteed.
#   4. Replace the `pnpm run dev &` + wait-on pair with Playwright's own
#      `webServer` config, which owns server lifecycle across steps properly.
#
# Also generate the three Prisma clients and build @vidyaverse/shared-validation
# before any backend step, exactly as typecheck.yml does.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: vidyaverse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        working-directory: ./frontend

      - name: Setup Database
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/vidyaverse_test

      - name: Seed Test Data
        run: pnpm run db:seed
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/vidyaverse_test

      - name: Start Backend
        run: pnpm run dev &
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/vidyaverse_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          BETTER_AUTH_SECRET: test-better-auth-secret-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          PORT: 3000

      - name: Wait for Backend
        run: npx wait-on http://localhost:3000/health

      - name: Start Frontend
        run: pnpm run dev &
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:3000

      - name: Wait for Frontend
        run: npx wait-on http://localhost:5173

      - name: Run Playwright Tests
        run: pnpm exec playwright test
        working-directory: ./frontend
        env:
          FRONTEND_URL: http://localhost:5173

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7
