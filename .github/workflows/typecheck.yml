name: CI

# The backend runs under `tsx`, which strips types without checking them, and the
# frontend ships through Vite. So nothing in the normal build or deploy path ever
# runs `tsc` — type errors accumulate silently and only surface as runtime
# surprises.
#
# That is not hypothetical: by the time this was added, an unused-import error had
# been sitting in App.tsx long enough that the `visionarium/test-series` route was
# rendering the wrong page in production, and tsconfig.build.json had `strict:false`
# which broke zod's required/optional inference and produced two phantom errors in
# taxonomy/routes.ts. Both were invisible precisely because nothing type-checked.
#
# This job is the gate. Keep it green.
#
# 2026-08-27: absorbed the parts of ci.yml worth keeping, and both it and
# ci-cd.yml were deleted. They had been red on every push for months for
# reasons unrelated to the code: ci-cd.yml pinned pnpm 8 (unreadable v10
# lockfile), provisioned MySQL for a postgresql schema, and pushed ghcr images
# plus a staging deploy that no longer describe how this app ships (Coolify
# builds from the repo). ci.yml pinned pnpm 9 and re-ran the same typechecks
# as this file but without generating the Prisma clients or building
# shared-validation first, so it always failed where this one passes.
#
# 2026-08-27 (later): backend lint and backend unit tests are now gated too.
# The 10 lint errors and 9 failing tests they carried are fixed. Backend lint
# still reports ~109 WARNINGS (ban-ts-comment, no-unused-vars); eslint does not
# fail on warnings, and clearing them is a separate cleanup - do not gate on
# warning count without doing that work first.
#
# The unit suite pins its own env in vitest.config.unit.ts. It has to:
# src/config/env.ts validates on import and calls process.exit(1) on a missing
# variable, which would kill the runner outright on a checkout with no .env.
# Backend INTEGRATION tests still are not gated - they need a live Postgres.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the curriculum loader test (src/modules/curriculum/__tests__/loader.db.test.ts),
    # which wipes and re-creates its `taxonomy` schema. Nothing else in the unit suite touches it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Prisma Clients are generated, not committed; the backend will not
      # typecheck without them. There are THREE datasources, each with its own
      # client — missing the taxonomy one is what took the taxonomy service down
      # in production, so generate all three here too.
      - name: Generate Prisma Clients
        run: |
          pnpm --filter @vidyaverse/backend exec prisma generate
          pnpm --filter @vidyaverse/backend exec prisma generate --schema prisma/entitlements/schema.prisma
          pnpm --filter @vidyaverse/backend exec prisma generate --schema prisma/taxonomy/schema.prisma

      - name: Build shared packages
        run: pnpm --filter @vidyaverse/shared-validation build

      - name: Typecheck backend
        run: pnpm --filter @vidyaverse/backend exec tsc --noEmit

      - name: Typecheck backend (build config)
        run: pnpm --filter @vidyaverse/backend exec tsc -p tsconfig.build.json --noEmit

      - name: Typecheck frontend
        run: pnpm --filter @vidyaverse/frontend exec tsc --noEmit

      # The Indic design system is vendored from PDLMS and loads after
      # @tailwind utilities, so any class of its that sets `position` beats the
      # Tailwind utility on the same element at equal specificity. That silently
      # unpinned the app shell sidebar and double-offset every page content
      # column by 512px. src/styles/indic-layout-repairs.css repairs it; this
      # step keeps a future design-system sync from reintroducing the bug.
      - name: Check Indic layout clobbers (frontend)
        run: pnpm --filter @vidyaverse/frontend run check:layout-clobbers

      - name: Lint backend
        run: pnpm --filter @vidyaverse/backend run lint

      - name: Lint frontend
        run: pnpm --filter @vidyaverse/frontend run lint

      - name: Test backend (unit)
        run: pnpm --filter @vidyaverse/backend run test:unit
        env:
          CURRICULUM_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/trio?schema=taxonomy

      - name: Test frontend
        run: pnpm --filter @vidyaverse/frontend run test
